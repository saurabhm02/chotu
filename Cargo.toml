[package]
name = "ty-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "HtmlElement",
    "Window",
    "Document",
    "Element",
    "CssStyleDeclaration"
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
log = "0.4"
wasm-logger = "0.2"
dotenvy = "0.15"
pulldown-cmark = "0.13.4"
gloo-timers = "0.3"
serde_json = "1"

[workspace]
members = ["src-tauri"]

# Smaller debug builds: keep line tables for backtraces, drop dependency debuginfo.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
